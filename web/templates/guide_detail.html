{% extends "base.html" %}
{% set active_page = "guides" %}
{% block title %}{{ guide.title }}{% endblock %}

{% block content %}
<div class="page-header">
  <div class="flex-between">
    <div>
      <h2>{{ guide.title }}</h2>
      <p class="desc">Methodology guide and checklist</p>
    </div>
    <a href="/guides" class="btn btn-sm">&#8592; All Guides</a>
  </div>
</div>

<div class="card">
  <div class="guide-content" id="guide-body"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  const raw = {{ guide.content | tojson }};
  const html = marked.parse(raw);
  document.getElementById('guide-body').innerHTML = html;
});
</script>
{% endblock %}
